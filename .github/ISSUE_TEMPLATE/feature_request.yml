name: Feature idea
description: Suggest something OpenFlyover could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you want to achieve, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: checkboxes
    id: rules
    attributes:
      label: Ground rules
      options:
        - label: This idea doesn't require copying another app's code, design or assets.
          required: true
